<!DOCTYPE html>
<html>
<head>
  <!--
    The base path is replaced by the value of `--base-href` given to
    `flutter build` ("/" locally, "/ftme/" on GitHub Pages).
  -->
  <base href="/ftme/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ftMe: finish what you start.">
  <meta name="theme-color" content="#E6E0D6">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- A Home Screen app (Oct 23, 2026): full screen, named ftMe, on Bone. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ftMe">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- What an iPhone shows while ftMe opens from the Home Screen
       (made by tool/make_web_splash.py). -->
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash/iphone-750x1334.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/iphone-1242x2208.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/iphone-1125x2436.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash/iphone-828x1792.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/iphone-1242x2688.png">
  <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/iphone-1170x2532.png">
  <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/iphone-1284x2778.png">
  <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/iphone-1179x2556.png">
  <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/iphone-1290x2796.png">
  <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/iphone-1206x2622.png">
  <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/iphone-1320x2868.png">
  <link rel="apple-touch-startup-image" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/iphone-1260x2736.png">

  <!-- The card a message app shows for a link to ftMe (the fix pass, Oct
       24, 2026). The invite links' copy (404.html, which GitHub Pages
       serves for /join/<code>) says "Join my rope on ftMe" instead:
       tool/deploy_web.sh writes it. -->
  <meta property="og:site_name" content="ftMe">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Join my rope on ftMe">
  <meta property="og:description" content="Only your rope sees your climb. Never public.">
  <meta property="og:image" content="https://torimorillo.github.io/ftme/og-rope.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Two hikers on a rope, and room for one more">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>ftMe</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #E6E0D6; }
    #splash {
      position: fixed; inset: 0; background: #E6E0D6;
      display: flex; align-items: center; justify-content: center;
    }
    #splash img { width: 96px; height: 96px; border-radius: 22px; }
  </style>
</head>
<body>
  <!-- Bone, with the icon, until ftMe draws its first screen. -->
  <div id="splash"><img src="icons/Icon-192.png" alt=""></div>
  <script>
    // ftMe's own service worker: the rope's push notifications (sw.js).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js', { scope: './' })
        .catch(function () {});
    }
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) splash.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
